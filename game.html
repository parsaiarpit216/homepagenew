<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/webp" href="logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brick Breaker</title>
    <style>
        * {
            /* Prevent text selection and long-press menus */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        body {
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #000;
            border: 2px solid #fff;
            max-width: 95vw;
            max-height: 40vh;
        }
        .controls {
            display: flex;
            gap: 40px;
            margin-top: 30px;
        }
        .touch-btn {
            width: 100px;
            height: 100px;
            background: #444;
            border: 3px solid #eee;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            /* Critical for response */
            touch-action: none; 
        }
        .touch-btn:active {
            background: #666;
            transform: scale(0.95);
        }
        #info { margin-bottom: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="info">Score: 0 | Lives: 3</div>
    <canvas id="gameCanvas" width="480" height="320"></canvas>

    <div class="controls">
        <div id="leftBtn" class="touch-btn">◀</div>
        <div id="rightBtn" class="touch-btn">▶</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 3;
        let dy = -3;
        const ballRadius = 8;
        const paddleHeight = 12;
        const paddleWidth = 85;
        let paddleX = (canvas.width - paddleWidth) / 2;

        let rightPressed = false;
        let leftPressed = false;

        // Bricks
        const brickRowCount = 3;
        const brickColumnCount = 5;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 35;
        const bricks = [];

        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        // --- THE FIX: BETTER EVENT HANDLING ---

        const handleLeft = (isPressed) => { leftPressed = isPressed; };
        const handleRight = (isPressed) => { rightPressed = isPressed; };

        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");

        // Touch Events
        leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); handleLeft(true); }, {passive: false});
        leftBtn.addEventListener("touchend", (e) => { e.preventDefault(); handleLeft(false); }, {passive: false});
        
        rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); handleRight(true); }, {passive: false});
        rightBtn.addEventListener("touchend", (e) => { e.preventDefault(); handleRight(false); }, {passive: false});

        // Mouse Events (for testing on desktop)
        leftBtn.addEventListener("mousedown", () => handleLeft(true));
        leftBtn.addEventListener("mouseup", () => handleLeft(false));
        rightBtn.addEventListener("mousedown", () => handleRight(true));
        rightBtn.addEventListener("mouseup", () => handleRight(false));

        // Keyboard Support
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") handleRight(true);
            if (e.key === "ArrowLeft") handleLeft(true);
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight") handleRight(false);
            if (e.key === "ArrowLeft") handleLeft(false);
        });

        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score++;
                            if (score === brickRowCount * brickColumnCount) {
                                alert("WINNER!");
                                document.location.reload();
                            }
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Bricks
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let bx = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let by = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = bx;
                        bricks[c][r].y = by;
                        ctx.fillStyle = "#ff4444";
                        ctx.fillRect(bx, by, brickWidth, brickHeight);
                    }
                }
            }

            // Draw Ball
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.closePath();

            // Draw Paddle
            ctx.fillStyle = "#0095DD";
            ctx.fillRect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);

            document.getElementById("info").innerText = `Score: ${score} | Lives: ${lives}`;

            collisionDetection();

            // Movement Logic
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
            if (y + dy < ballRadius) dy = -dy;
            else if (y + dy > canvas.height - ballRadius) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                } else {
                    lives--;
                    if (!lives) { alert("GAME OVER"); document.location.reload(); }
                    else { x = canvas.width/2; y = canvas.height-30; dx = 3; dy = -3; }
                }
            }

            if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 7;
            if (leftPressed && paddleX > 0) paddleX -= 7;

            x += dx;
            y += dy;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
